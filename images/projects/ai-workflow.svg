<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">AI workflow automation and decision-support architecture</title>
  <desc id="desc">Web and API inputs are normalized and deduplicated, retrieved as evidence, converted to structured model output, validated, routed with retries, logged with state, notified by email, and sent to human review.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#315f8c"/></marker>
  </defs>
  <rect width="1400" height="620" rx="18" fill="#fbfaf7"/>
  <text x="60" y="70" font-family="Georgia, serif" font-size="36" fill="#202124">Traceable workflow with validation and human review</text>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle" fill="#202124">
    <g><rect x="55" y="145" width="210" height="105" rx="12" fill="#fff" stroke="#9aa3aa"/><text x="160" y="190" font-size="20">Web / API</text><text x="160" y="218" font-size="16" fill="#62666d">ingestion</text></g>
    <g><rect x="325" y="145" width="210" height="105" rx="12" fill="#fff" stroke="#9aa3aa"/><text x="430" y="187" font-size="20">Normalize</text><text x="430" y="216" font-size="16" fill="#62666d">and deduplicate</text></g>
    <g><rect x="595" y="145" width="210" height="105" rx="12" fill="#fff" stroke="#9aa3aa"/><text x="700" y="190" font-size="20">Retrieve</text><text x="700" y="218" font-size="16" fill="#62666d">supporting evidence</text></g>
    <g><rect x="865" y="145" width="210" height="105" rx="12" fill="#fff" stroke="#9aa3aa"/><text x="970" y="187" font-size="20">Structured output</text><text x="970" y="216" font-size="16" fill="#62666d">from the language model</text></g>
    <g><rect x="1135" y="145" width="210" height="105" rx="12" fill="#eef3f7" stroke="#315f8c"/><text x="1240" y="187" font-size="20">Schema validation</text><text x="1240" y="216" font-size="16" fill="#62666d">before routing</text></g>
    <g><rect x="1135" y="365" width="210" height="105" rx="12" fill="#fff" stroke="#9aa3aa"/><text x="1240" y="407" font-size="20">Conditional route</text><text x="1240" y="436" font-size="16" fill="#62666d">with controlled retries</text></g>
    <g><rect x="865" y="365" width="210" height="105" rx="12" fill="#fff" stroke="#9aa3aa"/><text x="970" y="407" font-size="20">Log and state</text><text x="970" y="436" font-size="16" fill="#62666d">retain intermediate evidence</text></g>
    <g><rect x="595" y="365" width="210" height="105" rx="12" fill="#fff" stroke="#9aa3aa"/><text x="700" y="407" font-size="20">Email notification</text><text x="700" y="436" font-size="16" fill="#62666d">surface review items</text></g>
    <g><rect x="325" y="365" width="210" height="105" rx="12" fill="#eef3f7" stroke="#315f8c"/><text x="430" y="407" font-size="20">Human review</text><text x="430" y="436" font-size="16" fill="#62666d">approves final action</text></g>
  </g>
  <g stroke="#315f8c" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M265 198 H315"/><path d="M535 198 H585"/><path d="M805 198 H855"/><path d="M1075 198 H1125"/>
    <path d="M1240 250 V355"/><path d="M1135 418 H1085"/><path d="M865 418 H815"/><path d="M595 418 H545"/>
  </g>
  <path d="M1240 365 C1390 340 1370 125 1240 145" fill="none" stroke="#a65a4a" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="1310" y="315" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#a65a4a" transform="rotate(-90 1310 315)">retry on invalid output</text>
  <text x="60" y="555" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" fill="#62666d">The model proposes structured content; validation and a human checkpoint control whether any downstream action proceeds.</text>
</svg>
